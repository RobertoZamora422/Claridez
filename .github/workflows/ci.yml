        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: claridez-ci-postgres-admin-password
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres -h 127.0.0.1 -p 5432"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      CLARIDEZ_ENVIRONMENT: local
      CLARIDEZ_SECRET_KEY: claridez-ci-secret-key-at-least-thirty-two-characters
      CLARIDEZ_ALLOWED_HOSTS: 127.0.0.1,localhost
      CLARIDEZ_LOG_LEVEL: INFO
      CLARIDEZ_AUTH_LINK_BASE_URL: http://127.0.0.1:5173
      CLARIDEZ_DB_HOST: 127.0.0.1
      CLARIDEZ_DB_PORT: "5432"
      CLARIDEZ_DB_CONNECT_TIMEOUT: "3"
      CLARIDEZ_DB_STATEMENT_TIMEOUT_MS: "3000"
      CLARIDEZ_DB_SSLMODE: disable
      CLARIDEZ_DB_NAME: claridez_local
      CLARIDEZ_DB_USER: claridez_app
      CLARIDEZ_DB_PASSWORD: claridez-ci-application-password-0001
      CLARIDEZ_MIGRATION_DB_USER: claridez_migrator
      CLARIDEZ_MIGRATION_DB_PASSWORD: claridez-ci-migrator-password-000001
      CLARIDEZ_TEST_DB_NAME: claridez_test
      CLARIDEZ_TEST_DB_USER: claridez_test_runner
      CLARIDEZ_TEST_DB_PASSWORD: claridez-ci-test-runner-password-0001
      CLARIDEZ_POSTGRES_ADMIN_DB: postgres
      CLARIDEZ_POSTGRES_ADMIN_USER: postgres
      CLARIDEZ_POSTGRES_ADMIN_PASSWORD: claridez-ci-postgres-admin-password
    steps:
      - name: Descargar el repositorio
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configurar Node.js
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Configurar Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Restaurar caché de uv
        # actions/cache v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py3.13-${{ hashFiles('apps/api/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py3.13-
      - name: Instalar toolchains y dependencias
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.0
          npm install --global npm@11.16.0 --ignore-scripts
          test "$(node --version)" = "v24.18.1"
          test "$(npm --version)" = "11.16.0"
          test "$(uv --version | cut -d' ' -f1-2)" = "uv 0.12.0"
          uv --directory apps/api lock --check
          uv --directory apps/api sync --locked
          npm ci
      - name: Aplicar configuración del clúster
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET cluster_name = 'claridez-local'"
          docker exec "$POSTGRES_CONTAINER_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET timezone = 'UTC'"
          docker restart "$POSTGRES_CONTAINER_ID"
          for attempt in {1..30}; do
            if docker exec "$POSTGRES_CONTAINER_ID" pg_isready -U postgres -d postgres -h 127.0.0.1 -p 5432; then
              exit 0
            fi
            echo "Esperando PostgreSQL (${attempt}/30)"
            sleep 1
          done
          exit 1
      - name: Preparar roles y base con la herramienta del repositorio
        run: npm run db:prepare
      - name: Migrar desde cero y reconciliar privilegios
        run: npm run db:migrate
      - name: Verificar PostgreSQL y ausencia de migraciones
        run: |
          npm run db:check
          npm run db:migrations:check
      - name: Ejecutar integración PostgreSQL
        run: npm run test:integration
      - name: Verificar árbol reproducible
        run: |
          git diff --check
          git diff --exit-code

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
