name: claridez

services:
  postgres:
    image: postgres:17.10-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
    platform: linux/amd64
    container_name: claridez-postgres-local
    restart: "on-failure:3"
    environment:
      POSTGRES_DB: ${CLARIDEZ_POSTGRES_ADMIN_DB}
      POSTGRES_USER: ${CLARIDEZ_POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${CLARIDEZ_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - cluster_name=claridez-local
    ports:
      - "127.0.0.1:${CLARIDEZ_DB_PORT}:5432"
    volumes:
      - claridez_postgres17_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1 -p 5432
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

  clamav:
    image: clamav/clamav:1.4@sha256:7173cd3d57a839c6fee673b07246301e0d1f68f5a14a5ca063f502323bf1cc61
    platform: linux/amd64
    container_name: claridez-clamav-local
    profiles: ["documents"]
    restart: "on-failure:3"
    ports:
      - "127.0.0.1:${CLARIDEZ_DOCUMENT_SCANNER_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 6m
    stop_grace_period: 30s

  document-worker:
    build:
      context: .
      dockerfile: apps/api/docker/render-worker.Dockerfile
    image: claridez/document-worker:p9-local
    platform: linux/amd64
    container_name: claridez-document-worker-local
    profiles: ["documents"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CLARIDEZ_DB_HOST: postgres
      CLARIDEZ_DB_PORT: 5432
      CLARIDEZ_DOCUMENT_SCANNER_HOST: clamav
      CLARIDEZ_DOCUMENT_SCANNER_PORT: 3310
      CLARIDEZ_DOCUMENT_RENDERER_ENVIRONMENT: claridez-render-weasyprint-69.0-debian12-v1
    volumes:
      - ./.runtime/documents:/workspace/.runtime/documents
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    command: ["--max-seconds", "86400"]
    stop_grace_period: 30s

volumes:
  claridez_postgres17_data:
    name: claridez_postgres17_data
